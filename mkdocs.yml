site_name: LLM-Agent-System
site_description: Modular multi-agent LLM orchestration framework — Linux, local-first
site_url: https://tp19.github.io/LLM-Agent-System/

repo_name: TP19/LLM-Agent-System
repo_url: https://github.com/TP19/LLM-Agent-System

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start: QUICKSTART.md
  - Architecture: ARCHITECTURE.md
  - Ingesting documents (manage_rag): MANAGE_RAG.md
  - Dependencies: DEPENDENCIES.md
